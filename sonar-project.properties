# Core Project Identification
sonar.projectKey=dummy-project
sonar.projectName=Dummy Project
sonar.sourceEncoding=UTF-8

# Separate Application Code from Test Files
sonar.sources=pages,fixtures,javaScript
sonar.tests=tests

# Exclusions
sonar.exclusions=node_modules/**,playwright-report/**,test-results/**

