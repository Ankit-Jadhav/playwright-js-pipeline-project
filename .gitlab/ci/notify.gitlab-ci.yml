send_teams_success:
  image: curlimages/curl:latest
  stage: notify
  tags:
    - local
  rules:
    - when: on_success # Runs ONLY if previous testing jobs passed!
  script:
    - |
      PAYLOAD=$(cat <<EOF
      {
        "@type": "MessageCard",
        "@context": "http://schema.org/extensions",
        "themeColor": "00FF00",
        "summary": "Pipeline Success",
        "sections": [{
          "activityTitle": "✅ Playwright Tests Passed!",
          "activitySubtitle": "GitLab CI/CD Notification",
          "text": "**Project:** $CI_PROJECT_NAME <br> **Branch:** \`$CI_COMMIT_BRANCH\` <br><br> All automation tests executed flawlessly on the local runner.",
          "markdown": true
        }]
      }
      EOF
      )
      curl -k -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" $TEAMS_WEBHOOK_URL

send_teams_failure:
  image: curlimages/curl:latest
  stage: notify
  tags:
    - local
  rules:
    - when: on_failure # Runs ONLY if a previous testing job broke!
  script:
    - |
      PAYLOAD=$(cat <<EOF
      {
        "@type": "MessageCard",
        "@context": "http://schema.org/extensions",
        "themeColor": "FF0000",
        "summary": "Pipeline Failure",
        "sections": [{
          "activityTitle": "❌ Playwright Tests Failed!",
          "activitySubtitle": "GitLab CI/CD Notification",
          "text": "**Project:** $CI_PROJECT_NAME <br> **Branch:** \`$CI_COMMIT_BRANCH\` <br><br> Automation suite has encountered failures. Please review the GitLab CI/CD artifacts immediately.",
          "markdown": true
        }]
      }
      EOF
      )
      curl -k -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" $TEAMS_WEBHOOK_URL