send_teams_alert:
  image: alpine:latest
  stage: notify
  tags:
    - local
  rules:
    - when: always # 💡 Ensures an alert is sent whether tests PASS or FAIL
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Sending pipeline status to Microsoft Teams..."
    - |
      if [ "$CI_JOB_STATUS" == "success" ]; then
        COLOR="00FF00" # Green
        TITLE="✅ Playwright Tests Passed!"
        TEXT="**Project:** $CI_PROJECT_NAME <br> **Branch:** \`$CI_COMMIT_BRANCH\` <br><br> All 15 automation tests executed flawlessly on the local runner."
      else
        COLOR="FF0000" # Red
        TITLE="❌ Playwright Tests Failed!"
        TEXT="**Project:** $CI_PROJECT_NAME <br> **Branch:** \`$CI_COMMIT_BRANCH\` <br><br> Automation suite has encountered failures. Please review the GitLab CI/CD artifacts immediately."
      fi
      
      # Construct the Microsoft Teams Connector JSON Payload
      PAYLOAD=$(cat <<EOF
      {
        "@type": "MessageCard",
        "@context": "http://schema.org/extensions",
        "themeColor": "$COLOR",
        "summary": "Pipeline Status",
        "sections": [{
          "activityTitle": "$TITLE",
          "activitySubtitle": "GitLab CI/CD Notification",
          "text": "$TEXT",
          "markdown": true
        }]
      }
      EOF
      )
      
      # Execute the free Teams webhook
      curl -X POST -H 'Content-Type: application/json' \
      -d "$PAYLOAD" \
      $TEAMS_WEBHOOK_URL