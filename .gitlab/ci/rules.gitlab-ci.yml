# 🧠 Define individual rules as reusable YAML anchors using the "&" symbol
.rules_library:
  - &only_mr
    if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    
  - &qa_environment
    if: '$CI_COMMIT_BRANCH =~ /^qa\//'
    
  - &production_environment
    if: '$CI_COMMIT_BRANCH == "main"'
    
  - &manual_trigger
    if: '$CI_PIPELINE_SOURCE == "web"'

# 🎯 Create a unified template that dynamically computes your Playwright tags
.playwright_rules_template:
  rules:
    # 🛑 1. Global Skips (Drafts and Explicit No-E2E labels)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(Draft:|\[Draft\])/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /noe2e/'
      when: never

    # 📈 2. Match Regression Label in Open MRs
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /regression/'
      variables:
        TEST_SCOPE: "@regression"
      when: on_success

    # 🔍 3. Match Sanity Label in Open MRs
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /sanity/'
      variables:
        TEST_SCOPE: "@sanity"
      when: on_success

    # 🧪 4. Fallback to Smoke: Reusing your environment anchors via "*"
    - <<: *only_mr
      variables:
        TEST_SCOPE: "@smoke"
      when: on_success
    - <<: *qa_environment
      variables:
        TEST_SCOPE: "@smoke"
      when: on_success
    - <<: *production_environment
      variables:
        TEST_SCOPE: "@smoke"
      when: on_success
    - <<: *manual_trigger
      variables:
        TEST_SCOPE: "@smoke"
      when: on_success