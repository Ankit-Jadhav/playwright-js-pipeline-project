.playwright_base:
  image: mcr.microsoft.com/playwright:v1.61.0-noble
  timeout: 30m 
  interruptible: true 
  before_script:
    - npm config set strict-ssl false
  artifacts:
    name: "playwright-report-$CI_COMMIT_REF_SLUG"
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 2 days

playwright:execution-engine:
  stage: test
  tags:
    - local
  parallel: 2 
  
  # 🎯 FIXED: Merged both parents into a single multi-extends array block
  extends: 
    - .playwright_base
    - .playwright_rules_template

  script:
    - echo "Initializing Execution Engine..."
    - echo "Active Target Scope ---> $TEST_SCOPE"
    
    # 🎯 Playwright executes the exact tag chosen by your labels across your sharded runner blocks!
    - npx playwright test --grep $TEST_SCOPE --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL