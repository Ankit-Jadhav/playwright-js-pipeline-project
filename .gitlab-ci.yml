stages:
  - install
  - test
  - notify
  - cleanup # Added cleanup stage

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NODE_ENV: "test"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH =~ /^qa\//
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

include:
  - local: '.gitlab/ci/rules.gitlab-ci.yml'
  - local: '.gitlab/ci/build.gitlab-ci.yml'
  - local: '.gitlab/ci/e2e.gitlab-ci.yml'
  - local: '.gitlab/ci/cleanup.gitlab-ci.yml' # Included the cleanup script
  - local: '.gitlab/ci/notify.gitlab-ci.yml' # Included the notification script
  - local: '.gitlab/ci/sonar.gitlab-ci.yml'