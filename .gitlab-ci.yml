# Use the official Microsoft Playwright image as the base environment
image: mcr.microsoft.com/playwright:v1.61.0-noble

stages:
  - test

run_playwright_tests:
  stage: test
  tags:
    - local  # <-- CRITICAL: This directs the job straight to your local Docker runner!
  before_script:
    - npm ci  # Clean install of your project dependencies listed in package-lock.json
  script:
    - echo "Successfully connected to local runner! Starting Playwright tests..."
    - npx playwright test
  artifacts:
    name: "playwright-report-$CI_COMMIT_REF_NAME"
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days